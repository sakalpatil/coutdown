<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tittlebar">Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0f1a;
    --panel:#121826;
    --panel-2:#1a2233;
    --line: rgba(255,255,255,0.08);
    --text:#eef1f7;
    --muted:#8b94a7;
    --amber:#f6b04d;
    --coral:#f2734a;
    --track:#232b3d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(246,176,77,0.10), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(242,115,74,0.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:22px;
    padding:44px 40px 38px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-40%; right:-20%;
    width:280px; height:280px;
    background: conic-gradient(from 210deg, var(--amber), var(--coral), transparent 60%);
    filter: blur(70px);
    opacity:0.35;
    pointer-events:none;
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background: var(--amber);
    box-shadow:0 0 0 4px rgba(246,176,77,0.15);
  }

  h1.headline{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.4rem;
    line-height:1.35;
    margin-top:14px;
    color:var(--text);
  }
  h1.headline span{ color:var(--amber); }

  .counter-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-top:30px;
  }

  .big-number{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:6.4rem;
    line-height:1;
    background:linear-gradient(90deg, var(--amber), var(--coral));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .big-label{
    font-size:1.05rem;
    color:var(--muted);
    font-weight:500;
    padding-bottom:10px;
  }

  .sub{
    margin-top:6px;
    color:var(--muted);
    font-size:0.95rem;
  }

  /* progress section */
  .progress-wrap{
    margin-top:36px;
  }

  .progress-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:0.8rem;
    color:var(--muted);
    margin-bottom:10px;
    letter-spacing:0.02em;
  }

  .progress-meta strong{
    color:var(--text);
    font-weight:600;
  }

  .track{
    position:relative;
    height:12px;
    background:var(--track);
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--line);
  }

  .fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--amber), var(--coral));
    transition:width 1s ease;
  }

  .fill::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    width:40px;
    animation: shine 2.6s ease-in-out infinite;
  }

  @keyframes shine{
    0%{ transform:translateX(-40px); }
    100%{ transform:translateX(220px); }
  }

  .track-endpoints{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:0.72rem;
    color:var(--muted);
    font-weight:500;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:26px;
  }

  .stat{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }

  .stat .stat-num{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.9rem;
    font-weight:700;
    color:var(--text);
  }

  .stat .stat-label{
    font-size:0.78rem;
    color:var(--muted);
    margin-top:2px;
  }

  .quote{
    margin-top:30px;
    font-size:0.95rem;
    color:var(--muted);
    font-style:italic;
    border-left:2px solid var(--amber);
    padding-left:14px;
  }

  @media (max-width:520px){
    .card{ padding:32px 24px; }
    .big-number{ font-size:4.4rem; }
    h1.headline{ font-size:1.2rem; }
    .stat-grid{ grid-template-columns:1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .fill{ transition:none; }
    .fill::after{ animation:none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span>Focus Sprint</div>

    <h1 class="headline">Only <span id="remainingDaysInline">0</span> days left to <span>31 August</span> — stay locked in.</h1>

    <div class="counter-row">
      <div class="big-number" id="bigCounter">0</div>
      <div class="big-label">days remaining</div>
    </div>
    <div class="sub" id="targetDateText">Target date: 31 August</div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Progress since <strong>1 June</strong></span>
        <strong id="progressPercent">0%</strong>
      </div>
      <div class="track">
        <div class="fill" id="fill"></div>
      </div>
      <div class="track-endpoints">
        <span>1 June</span>
        <span>31 August</span>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-num" id="daysPassed">0</div>
        <div class="stat-label">days passed since 1 June</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="daysLeftStat">0</div>
        <div class="stat-label">days left to 31 August</div>
      </div>
	    <div class="stat">
        <div class="stat-num" id="daysLeftStatAug1">0</div>
        <div class="stat-label">days left to 1 August</div>
      </div>
    </div>

    <div class="quote">"Small progress every day leads to big results."</div>
  </div>

<script>
  const DAY = 1000 * 60 * 60 * 24;

  function getCycle(today){
    let year = today.getFullYear();
    let target = new Date(year, 7, 31); // August 31
	let MidTarget = new Date(year, 7, 1); // August 1
    let start  = new Date(year, 5, 1);  // June 1

    if (today > target){
      year++;
      target = new Date(year, 7, 31);
	  MidTarget = new Date(year, 7, 1);
      start  = new Date(year, 5, 1);
    }
    return { start, target,MidTarget };
  }

  function updateCountdown(){
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const { start, target ,MidTarget } = getCycle(today);

    const daysLeft = Math.max(0, Math.ceil((target - today) / DAY));
	const MidTargetdaysLeft = Math.max(0, Math.ceil((MidTarget - today) / DAY));
    const daysPassedRaw = Math.floor((today - start) / DAY);
    const daysPassed = Math.min(Math.max(daysPassedRaw, 0), Math.ceil((target - start) / DAY));
    const totalSpan = Math.max(1, Math.ceil((target - start) / DAY));
    const progress = Math.min(100, Math.max(0, (daysPassed / totalSpan) * 100));

    document.getElementById('bigCounter').textContent = daysLeft;
    document.getElementById('remainingDaysInline').textContent = daysLeft;
    document.getElementById('daysLeftStat').textContent = daysLeft;
    document.getElementById('daysPassed').textContent = daysPassed;
    document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
    document.getElementById('fill').style.width = progress + '%';
    document.getElementById('tittlebar').textContent = daysLeft + ' Days to 31 Aug';
	document.getElementById('daysLeftStatAug1').textContent=MidTargetdaysLeft
  }

  updateCountdown();
  setInterval(updateCountdown, 1000 * 60 * 30);
</script>

</body>
</html>
